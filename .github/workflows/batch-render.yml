name: Caos 60 - produzir 3 Shorts diarios
on:
  workflow_dispatch:
  schedule:
    - cron: '25 11 * * *'
permissions:
  contents: read
concurrency:
  group: caos60-daily-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'streamlink==8.6.3'
      - name: Verificar codigo e testes
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Renderizar e armazenar clipes autorizados
        run: python scripts/batch_render.py
